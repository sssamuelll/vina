name: Deploy OpenClo
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: 13.48.46.19
          REMOTE_USER: ubuntu
          SOURCE: dist/
          TARGET: /tmp/openclo-deploy/

      - name: Activate deploy
        uses: appleboy/ssh-action@v1
        with:
          host: 13.48.46.19
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo rsync -a --delete /tmp/openclo-deploy/ /var/www/openclo/
            sudo chown -R www-data:www-data /var/www/openclo/
