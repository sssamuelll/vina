name: Deploy OpenClo
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 16.192.98.132 # Elastic IP (antes 13.48.46.19, efímera — se liberó al asociar la Elastic)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          cp "$GITHUB_WORKSPACE/deploy/known_hosts" ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -o StrictHostKeyChecking=yes ubuntu@$DEPLOY_HOST "mkdir -p /tmp/openclo-deploy/assets /tmp/openclo-deploy/wasm"
          rsync -az --delete --no-inc-recursive -e "ssh -i ~/.ssh/key -o StrictHostKeyChecking=yes" dist/ ubuntu@$DEPLOY_HOST:/tmp/openclo-deploy/
          ssh -i ~/.ssh/key -o StrictHostKeyChecking=yes ubuntu@$DEPLOY_HOST "sudo rsync -a --delete /tmp/openclo-deploy/ /var/www/openclo/ && sudo chown -R www-data:www-data /var/www/openclo/"
          rm -f ~/.ssh/key
