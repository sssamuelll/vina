name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      # #631 (flaky tests under concurrent run) addressed via vitest.config.ts
      # `projects` API: tshirtMeshing + cubicBezier now run in a dedicated
      # `seamly-heavy` fork pool with singleFork:true, isolated from the
      # default thread pool. The previous `--exclude` workaround was removed
      # in the same change. See vitest.config.ts header for verification steps.
      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build

  # Rust crate gate (#748). Catches the failure mode where someone edits
  # crates/xpbd-wasm/src/lib.rs but forgets to rebuild + copy
  # `xpbd_wasm.{js,_bg.wasm}` into `public/wasm/`. Without this gate the app
  # silently runs against the stale binary and the Rust unit tests never run
  # in CI either.
  #
  # The gate has two layers:
  #   1. `cargo test` + `cargo clippy` catch source-level regressions (clippy
  #      uses `-D warnings`; allowed exceptions live in Cargo.toml's
  #      `[lints.clippy]`).
  #   2. `wasm-pack build` confirms the source still compiles to wasm32, and
  #      `scripts/verify-wasm-smoke.mjs` loads the *committed* binary and
  #      runs `XpbdSolver.step()` once to catch stale binaries that no
  #      longer load or panic on a basic step.
  #
  # We deliberately do NOT byte-compare the freshly-built wasm-pack output
  # against the committed `public/wasm/` copies. wasm-pack output is not
  # bit-stable across CI/local environment differences even with Rust +
  # wasm-pack pinned at the patch level (Ubuntu glibc, transitive
  # wasm-bindgen-cli install path, build-host linker variations). Chasing
  # byte-exactness produced false-positive failures with no actionable
  # signal — see the #748 history. The smoke test is the practical
  # surrogate.
  rust:
    name: Rust crate (cargo test + clippy + WASM smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/xpbd-wasm -> target

      - name: cargo test
        working-directory: crates/xpbd-wasm
        run: cargo test --all-targets

      - name: cargo clippy
        working-directory: crates/xpbd-wasm
        run: cargo clippy --all-targets -- -D warnings

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: wasm-pack build (verifies source compiles to wasm32)
        working-directory: crates/xpbd-wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Smoke-test committed WASM
        run: node scripts/verify-wasm-smoke.mjs

  # E2E gate. Runs Playwright against a dev server in headless Chromium with
  # ANGLE+SwiftShader for WebGL (config in playwright.config.ts).
  #
  # Today this is gated as `continue-on-error: true` and is NOT a required
  # check in `ci-success` below. The Step 2 commit that introduced this job
  # also adds `tests/e2e/dress-avatar-dod.spec.ts` — a deliberately-rojo
  # end-to-end check of the #506 sewing pipeline DoD ("Dress Avatar produces
  # a draped shirt"). That test is expected to fail until #527/#518/#556/#531
  # are resolved; once green, flip `continue-on-error` to false and add `e2e`
  # to `ci-success.needs` to promote it to a required gate.
  e2e:
    name: E2E (Playwright) — non-blocking until #506 closes
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Summary job for branch protection
  ci-success:
    name: CI Success
    needs: [validate, rust]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.validate.result }}" != "success" || "${{ needs.rust.result }}" != "success" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "All CI checks passed"
