[package]
name = "xpbd-wasm"
version = "0.1.0"
edition = "2021"
description = "XPBD cloth simulation solver compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
