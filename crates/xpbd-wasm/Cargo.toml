[package]
name = "xpbd-wasm"
version = "0.1.0"
edition = "2021"
description = "XPBD cloth simulation solver compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# A3 ratified: preventive insurance — produces useful console.error con
# context si Rust crate accidentally panics (e.g., future code with
# `unwrap()`). Crate is currently defensively written with 0 panic paths,
# but this safety net catches regressions. Cross-ref: D6/D4/A3 docs.
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true

# Clippy gate (CI: `cargo clippy --all-targets -- -D warnings`, see #748).
# Architecturally-ratified exceptions are allowed crate-wide here; everything
# else surfaces as warnings that fail the gate. Keep this list short and
# document each entry.
[lints.clippy]
# `is_multiple_of` rewrite is a stylistic suggestion in `next_prime`; the
# `n % 2 == 0` form mirrors the TS reference (`selfCollision.ts:nextPrime`)
# and the bit-exactness contract (A4 RFC § 2.4) values cross-language
# readability over micro-stylistic tightening. Track separately if a wider
# stylistic pass becomes worthwhile.
manual_is_multiple_of = "allow"
